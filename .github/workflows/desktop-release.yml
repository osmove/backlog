name: Desktop release

# Builds the Electron app and uploads installers to GitHub Releases.
# Triggered when a tag matching desktop-v* is pushed (e.g.
# `desktop-v1.4.1`). Each platform job runs on its native runner so
# the platform-specific tooling (codesign on macOS, dpkg/rpm on Linux,
# signtool on Windows once that lands) is available without a
# cross-compile dance.
#
# electron-builder's `publish: github` block in electron-builder.yml
# does the actual upload — we just hand it GH_TOKEN and the right
# platform flag. Auto-update metadata files (`latest-mac.yml`,
# `latest-linux.yml`) are produced and uploaded automatically; the
# desktop app's electron-updater picks the right one based on
# `process.platform`.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    # Manual trigger from the Actions UI when you want a build without
    # cutting a public release. The Linux job will produce artifacts
    # but won't publish (no tag = no release).

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # uploading release assets requires write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        with:
          version: 10.7.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `tsc -b` in @backlog/server needs every workspace dependency
      # already built (their dist/ + .d.ts must exist). The `...^`
      # filter syntax tells pnpm "this package and everything it
      # depends on, in topo order".
      - name: Build server + transitive deps (UI assets land in dist/public)
        run: pnpm --filter "@backlog/server..." build

      - name: Build desktop bundle (main + preload)
        run: pnpm --filter @backlog/desktop build

      # electron-builder reads electron-builder.yml's `publish: github`
      # block and uploads to the release that matches the current tag.
      # On workflow_dispatch (no tag) it builds but doesn't publish.
      - name: Package + publish (Linux)
        run: pnpm --filter @backlog/desktop exec electron-builder --linux --x64 --arm64 --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep AppImage + deb + rpm around as job artifacts for manual
      # smoke-testing even on workflow_dispatch runs.
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backlog-desktop-linux
          path: |
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.rpm
            packages/desktop/release/latest-linux*.yml
          if-no-files-found: warn
          retention-days: 14

  # Windows: built on a windows-latest runner because signtool, the
  # Windows code-signing toolchain, and the NSIS makensis binaries
  # only run there. v1 ships unsigned — SmartScreen will warn first-
  # time installers but the install completes. When the EV cert lands,
  # set the `WIN_CSC_LINK` (PFX, base64) and `WIN_CSC_KEY_PASSWORD`
  # secrets and electron-builder will sign automatically; remap them
  # to CSC_LINK / CSC_KEY_PASSWORD here in the env block.
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        with:
          version: 10.7.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server + transitive deps
        run: pnpm --filter "@backlog/server..." build

      - name: Build desktop bundle
        run: pnpm --filter @backlog/desktop build

      - name: Package + publish (Windows)
        # The shell defaults to pwsh on windows-latest; the && operator
        # works fine but the ternary expression syntax is the same as
        # the Linux job above — GH Actions evaluates ${{ }} before
        # handing the command to the shell.
        run: pnpm --filter @backlog/desktop exec electron-builder --win --x64 --arm64 --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code-signing secrets — left unset until the EV cert ships.
          # When set, electron-builder picks them up automatically and
          # signs the NSIS installer + portable exe.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backlog-desktop-windows
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.msi
            packages/desktop/release/latest.yml
          if-no-files-found: warn
          retention-days: 14

  # macOS: built on macos-latest because Apple's notarization tools
  # (xcrun notarytool, codesign, productbuild) are macOS-only. The
  # runner image already includes Xcode CLT.
  #
  # Required secrets in repo settings:
  #   APPLE_ID                       - the Apple Developer email
  #   APPLE_APP_SPECIFIC_PASSWORD    - app-specific password from
  #                                    appleid.apple.com (not the main pw)
  #   APPLE_TEAM_ID                  - 10-char Team ID, visible in
  #                                    developer.apple.com/account
  #   MACOS_CSC_LINK                 - Developer ID Application .p12,
  #                                    base64-encoded:
  #                                    `base64 -i cert.p12 | pbcopy`
  #   MACOS_CSC_KEY_PASSWORD         - the .p12 export password
  #
  # electron-builder picks up CSC_LINK + CSC_KEY_PASSWORD automatically
  # (we just rename the macOS-prefixed secrets in the env block to dodge
  # collision with the Windows ones), and the APPLE_* trio drives the
  # `notarize: true` step in electron-builder.yml's `mac:` block.
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    # Skip the macOS build entirely when the Apple secrets aren't
    # configured yet — the `mac:` block in electron-builder.yml has
    # `notarize: true` hardcoded, which requires reaching Apple's
    # notary service. Without APPLE_ID set the build will fail. Until
    # the secrets are added in repo settings, the user can build Mac
    # locally and `gh release upload` to attach DMGs to the release.
    if: ${{ vars.MACOS_BUILD_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        with:
          version: 10.7.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server + transitive deps
        run: pnpm --filter "@backlog/server..." build

      - name: Build desktop bundle
        run: pnpm --filter @backlog/desktop build

      - name: Package + publish (macOS)
        run: pnpm --filter @backlog/desktop exec electron-builder --mac --x64 --arm64 --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}

      # NOTE: no DMG-stapling step here — and the absence is deliberate.
      # electron-builder + electron-osx-sign notarize and staple the
      # **Backlog.app** inside each DMG. The DMG container itself is
      # never notarized (electron-builder doesn't submit it), so
      # `xcrun stapler` would fail with "Record not found" — there's
      # nothing to staple a ticket to.
      #
      # Critically, this is fine end-to-end. When a user downloads
      # Backlog-1.4.x-arm64.dmg, mounts it, and drags Backlog.app to
      # /Applications, Gatekeeper inspects the .app, finds the stapled
      # ticket, and launches without a warning — both online and
      # offline. The DMG container being unsigned is the same shape
      # 99% of macOS apps ship in (Slack, Notion, Cursor, …).
      #
      # If a future release moves to a DMG-level signing flow (e.g.
      # `electron-builder` adds `notarizeDmg: true` or we sign the
      # DMG manually with `productsign`), reintroduce a staple step
      # here. Until then, DON'T add one — it will always fail with
      # CloudKit "Record not found" because the record never existed.

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backlog-desktop-macos
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*-mac.zip
            packages/desktop/release/latest-mac.yml
          if-no-files-found: warn
          retention-days: 14

  # Publish the `backlog` CLI to npm on the same tag. Runs only on a
  # desktop-v* tag push (not workflow_dispatch) so a CI smoke test
  # never accidentally publishes. ci.yml has its own npm publish job
  # gated on `v*` tags — that path is for npm-only releases. This
  # one keeps CLI + Desktop versions in lockstep when a desktop-v*
  # tag is the trigger.
  npm:
    runs-on: ubuntu-latest
    # Idempotent: the publish step skips when local version == npm
    # version, so this is safe to run on every desktop-v* tag push
    # AND on manual workflow_dispatch. The dispatch path lets us
    # publish CLI without re-cutting a desktop release (e.g. when
    # NPM_TOKEN is added after the original tag was pushed).
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')) ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write   # required for npm provenance
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        with:
          version: 10.7.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # `pnpm --filter backlog...` walks the workspace dep graph in topo
      # order. The CLI's tsup bundles every internal package, but those
      # packages must have their dist/ + .d.ts produced first or
      # esbuild can't resolve `@backlog/config`, `@backlog/core`, etc.
      - name: Build CLI + transitive workspace deps
        run: pnpm --filter "backlog..." build

      - name: Publish if version is new
        # `pnpm publish` errors if the version already exists on npm.
        # Idempotent guard: read the local version + the latest published
        # version, only publish when they differ. Lets re-running the
        # workflow on a re-pushed tag be safe.
        run: |
          LOCAL=$(node -p "require('./packages/cli/package.json').version")
          REMOTE=$(npm view backlog version 2>/dev/null || echo "0.0.0")
          echo "local=$LOCAL remote=$REMOTE"
          if [ "$LOCAL" != "$REMOTE" ]; then
            pnpm --filter backlog publish --provenance --access public --no-git-checks
          else
            echo "Already published; skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Flip the draft GitHub Release to published once every platform
  # uploaded its artifacts. With electron-builder.yml's
  # `releaseType: draft`, all four jobs above upload into a hidden
  # release; clients of the auto-update channel never see it as
  # "latest" until this job runs. Eliminates the race window where a
  # user clicked "Check for Updates" between the windows job (which
  # creates the release) and macOS finishing notarisation (which
  # uploads latest-mac.yml) — they'd 404 on the platform manifest.
  finalize-release:
    needs: [linux, macos, windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tag is desktop-v<version>; release tag (electron-builder
          # convention) is v<version>. Read the version back from
          # package.json so this stays in sync if the bump rules change.
          VERSION=$(node -p "require('./packages/desktop/package.json').version")
          echo "Finalizing release v${VERSION}"
          # Sanity-check the artifacts everyone expects are actually
          # there. Bail loud if not — better to leave the draft up so
          # the release can be inspected manually than to publish a
          # half-baked one.
          REQUIRED=(
            "Backlog-${VERSION}-arm64.dmg"
            "Backlog-${VERSION}-x64.dmg"
            "latest-mac.yml"
            "Backlog-Setup-${VERSION}-x64.exe"
            "latest.yml"
            "Backlog-${VERSION}-x86_64.AppImage"
            "latest-linux.yml"
          )
          MISSING=()
          for asset in "${REQUIRED[@]}"; do
            if ! gh release view "v${VERSION}" --json assets -q ".assets[].name" | grep -qx "$asset"; then
              MISSING+=("$asset")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing artifacts on draft release v${VERSION}:"
            for m in "${MISSING[@]}"; do echo "  - $m"; done
            echo "Leaving draft for manual inspection."
            exit 1
          fi
          gh release edit "v${VERSION}" --draft=false
          echo "v${VERSION} flipped from draft → published."
