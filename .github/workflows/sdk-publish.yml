name: SDK publish

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5
        with:
          version: 10.7.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check SDK
        run: pnpm --filter @osmove/backlog-sdk typecheck

      - name: Build SDK
        run: pnpm --filter @osmove/backlog-sdk build

      - name: Package check SDK
        run: cd packages/sdk && npm pack --dry-run

      - name: Publish SDK if version is new
        run: |
          LOCAL=$(node -p "require('./packages/sdk/package.json').version")
          REMOTE=$(npm view @osmove/backlog-sdk version 2>/dev/null || echo "0.0.0")
          echo "local=$LOCAL remote=$REMOTE"
          if [ "$LOCAL" != "$REMOTE" ]; then
            cd packages/sdk
            pnpm publish --provenance --access public --no-git-checks
          else
            echo "Already published; skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
